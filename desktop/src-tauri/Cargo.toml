[package]
name = "spaces"
version = "0.1.22"
description = "Spaces — the local operating system for people and agents"
authors = ["Spaces"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lbrendle/spaces"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spaces_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "default-tls"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
libc = "0.2.189"
# Accessibility trust is a real API; the alternative was inferring it from a
# timeout, which cannot tell "denied" from "slow".
core-foundation = "0.10"
core-graphics = "0.25"
portable-pty = "0.9.0"

# Reading a page back out of the built-in browser.
#
# Tauri's `eval` is fire-and-forget: it runs a script and cannot tell you what
# the script produced, which is enough to press Back and useless for letting an
# agent see what is on screen. WKWebView's own
# `evaluateJavaScript:completionHandler:` does return a value, and these are
# what it takes to call it. All four are already in the tree as transitive
# dependencies of wry; naming them here makes that reliance explicit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
